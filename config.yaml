app:
  name: "Desk Companion AI"
  http_addr: "127.0.0.1:18888"
  data_dir: "data"
  workspace: "."
  auto_open_browser: true

runtime:
  default_mode: "desktop"
  enable_symbols: true
  enable_rag: true
  enable_preflight: true
  enable_docker: true
  enable_docker_validation: true
  enable_snapshots: true
  enable_sandbox_smoke: false
  auto_repair_rounds: 2
  max_knowledge_results: 4
  provider_timeout_sec: 20

workflow:
  backend: "auto"
  langgraph_endpoint: ""
  langgraph_timeout_sec: 25

redis:
  enabled: true
  url: "redis://127.0.0.1:6379/0"
  namespace: "desk_companion"
  auto_start_container: true
  container_name: "desk-companion-redis"

vision:
  enabled: true
  provider: "groq"
  model: "meta-llama/llama-4-scout-17b-16e-instruct"
  analyze_on_capture: true
  timeout_sec: 20

knowledge:
  include_paths:
    - "README.md"
    - "docs"
    - "cmd"
    - "companion"
    - "agent"
    - "engine"
    - "executor"
    - "llm"
    - "mcp"
    - "rag"
  exclude_names:
    - ".git"
    - ".vscode"
    - "bin"
    - "accounts"
    - "data"
  max_file_size_kb: 512
  chunk_size: 700

providers:
  - name: "mock"
    default_model: "companion-mock-v1"
    models:
      - "companion-mock-v1"

  - name: "ollama"
    base_url: "http://localhost:11434/v1"
    default_model: "qwen2.5-coder:7b"
    models:
      - "qwen2.5-coder:7b"
      - "llama3.1"
      - "deepseek-coder"

  - name: "groq"
    api_key: "${GROQ_API_KEY}"
    base_url: "https://api.groq.com/openai/v1"
    default_model: "openai/gpt-oss-120b"
    models:
      - "openai/gpt-oss-120b"
      - "llama-3.3-70b-versatile"
      - "llama-3.1-8b-instant"

  - name: "openai"
    api_key: "${OPENAI_API_KEY}"
    base_url: "https://api.openai.com/v1"
    default_model: "gpt-4o-mini"
    models:
      - "gpt-4o-mini"
      - "gpt-4o"

  - name: "siliconflow"
    api_key: "${SILICONFLOW_API_KEY}"
    base_url: "https://api.siliconflow.cn/v1"
    default_model: "Qwen/Qwen2.5-72B-Instruct"
    models:
      - "Qwen/Qwen2.5-72B-Instruct"
      - "deepseek-ai/DeepSeek-V2.5"
